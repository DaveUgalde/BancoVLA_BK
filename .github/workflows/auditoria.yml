name: Auditar dependencias

on:
  schedule:
    - cron: "0 9 * * 1"      # lunes 9am
  workflow_dispatch:          # y botón manual

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # PYSEC-2026-1325: ecdsa, dependencia transitiva de python-jose[cryptography].
      # No existe version con parche, se ignora hasta migrar a PyJWT.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325